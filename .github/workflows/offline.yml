name: Offline checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install development dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Check Python and browser lifecycle regressions
        run: |
          python -m ruff check .
          python -m pytest
          node --test tests/ui_lifecycle.cjs
      - name: Check architecture policy and negative controls
        run: |
          python scripts/policy_gate.py --candidate server
          set +e
          python scripts/policy_gate.py --candidate baseline
          baseline=$?
          python scripts/policy_gate.py --candidate wrong-fix
          wrong_fix=$?
          set -e
          test "$baseline" -eq 1
          test "$wrong_fix" -eq 1
